name: Release FocusDesk (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run FocusCore unit tests
        run: swift test

      - name: Import Developer ID certificate (optional)
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASS=focusdesk-ci-keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

      - name: Build, smoke-test, and package .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/make-dmg.command --skip-tests

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusDesk-macOS
          path: dist.noindex/FocusDesk-macOS.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: |
          dotnet publish windows/FocusDesk.Windows/FocusDesk.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist-win

      - name: Run Windows smoke-test and package executable
        shell: pwsh
        run: |
          if (!(Test-Path dist-win/FocusDesk.exe)) { throw "FocusDesk.exe was not produced by dotnet publish" }
          $proc = Start-Process -FilePath "dist-win/FocusDesk.exe" -ArgumentList "--smoke-test" -Wait -PassThru -NoNewWindow
          if (Test-Path windows-smoke-report.txt) {
            Get-Content windows-smoke-report.txt
          }
          if ($proc.ExitCode -ne 0) {
            throw "Windows smoke-test failed with exit code $($proc.ExitCode)"
          }
          Copy-Item dist-win/FocusDesk.exe FocusDesk-Windows-x64.exe

      # Real blocking on a real Windows desktop: Edge, Chrome and Firefox on a local test site, «Bloquear ahora»,
      # a task session and an app rule. No release is published if this fails.
      - name: Install Brave and Opera for the end-to-end test
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8
        run: |
          function Test-Browser($relatives) {
            foreach ($root in $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA) {
              foreach ($rel in $relatives) {
                $dir = Join-Path $root (Split-Path $rel -Parent)
                if ((Test-Path $dir) -and (Get-ChildItem $dir -Filter (Split-Path $rel -Leaf) -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) { return $true }
              }
            }
            return $false
          }
          function Wait-Browser($relatives, $seconds) {
            for ($t = 0; $t -lt $seconds; $t += 5) {
              if (Test-Browser $relatives) { return $true }
              Start-Sleep -Seconds 5
            }
            return $false
          }
          $brave = @('BraveSoftware\Brave-Browser\Application\brave.exe')
          $opera = @('Programs\Opera\opera.exe', 'Opera\opera.exe')

          # 1) Chocolatey (its server sometimes answers 503/504: two tries)
          foreach ($pkg in 'brave','opera') {
            for ($i = 1; $i -le 2; $i++) {
              choco install $pkg -y --no-progress
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 20
            }
          }
          # 2) If it is still missing, the installer straight from the browser's own site
          if (-not (Test-Browser $brave)) {
            Write-Host "Brave: Chocolatey failed, downloading the installer from brave.com"
            Invoke-WebRequest -Uri 'https://laptop-updates.brave.com/latest/winx64' -OutFile "$env:RUNNER_TEMP\brave-setup.exe" -MaximumRetryCount 4 -RetryIntervalSec 10
            Start-Process "$env:RUNNER_TEMP\brave-setup.exe" -ArgumentList '/silent','/install' -Wait
            Wait-Browser $brave 180 | Out-Null
          }
          if (-not (Test-Browser $opera)) {
            Write-Host "Opera: Chocolatey failed, downloading the installer from opera.com"
            Invoke-WebRequest -Uri 'https://net.geo.opera.com/opera/stable/windows' -OutFile "$env:RUNNER_TEMP\opera-setup.exe" -MaximumRetryCount 4 -RetryIntervalSec 10
            Start-Process "$env:RUNNER_TEMP\opera-setup.exe" -ArgumentList '/silent','/allusers=1','/launchopera=0','/setdefaultbrowser=0' -Wait
            Wait-Browser $opera 180 | Out-Null
          }
          Write-Host "Brave: $(Test-Browser $brave) · Opera: $(Test-Browser $opera)"

      - name: End-to-end test with real browsers
        shell: pwsh
        timeout-minutes: 25
        env:
          FOCUSDESK_E2E_REQUIRE_ALL: "1"
        run: |
          Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`r`n127.0.0.1 prueba-focusdesk.test"
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Edge" -Name HideFirstRunExperience -Value 1 -Type DWord
          $proc = Start-Process -FilePath "dist-win/FocusDesk.exe" -ArgumentList "--e2e-test" -Wait -PassThru -NoNewWindow
          if (Test-Path e2e-report.txt) { Get-Content e2e-report.txt }
          if ($proc.ExitCode -ne 0) { throw "End-to-end test failed with exit code $($proc.ExitCode)" }

      - name: Upload end-to-end screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FocusDesk-Windows-e2e
          path: |
            e2e-capturas/
            e2e-report.txt
          if-no-files-found: ignore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusDesk-Windows
          path: FocusDesk-Windows-x64.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: FocusDesk-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FocusDesk-Windows
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FocusDesk-macOS.dmg
            artifacts/FocusDesk-Windows-x64.exe
          generate_release_notes: true
